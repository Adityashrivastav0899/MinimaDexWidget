<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minima DEX Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="hero">
      <h1>Minima DEX Widget</h1>
      <p>Swap tokens through real blockchain routers with wallet approval and live transaction status.</p>
    </section>

    <section class="dex-card">
      <div class="top-row">
        <h2>Swap</h2>
        <button id="connectBtn">Connect Wallet</button>
      </div>

      <div id="walletBox" class="wallet-box hidden">
        <p><strong>Wallet:</strong> <span id="walletAddress"></span></p>
        <p><strong>Network:</strong> <span id="networkName"></span></p>
      </div>

      <div class="swap-box">
        <label>From Token</label>
        <select id="fromToken"></select>

        <label>Amount</label>
        <input id="amountIn" type="number" placeholder="0.0" min="0" />

        <p class="balance">Balance: <span id="fromBalance">0</span></p>
      </div>

      <button id="switchBtn" class="switch-btn">↓</button>

      <div class="swap-box">
        <label>To Token</label>
        <select id="toToken"></select>

        <label>Estimated Output</label>
        <input id="amountOut" disabled placeholder="0.0" />

        <p class="balance">Balance: <span id="toBalance">0</span></p>
      </div>

      <div class="settings">
        <label>Slippage %</label>
        <input id="slippage" type="number" value="1" min="0.1" step="0.1" />
      </div>

      <button id="swapBtn" class="swap-main">Swap Tokens</button>

      <div id="statusBox" class="status-box">Connect wallet to start</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
